# id は <年度>-<分類>-<連番>（例: 2026-journal-1）。分類は journal・intl-conf・domestic-conf・talk・press・article・book・patent・award。ファイルの中で重複させない（重複すると片方が表示されない）。
# citation は次の形で書く。業績ページのプレーンテキストをそのまま貼れる（# : " \ もそのまま書ける）。
#   citation: >-
#     Taro Keio, Hiroaki Nishi, “Rust #2 and C# Toolkit…”, IEEE Access, 2026.
# 1行目は `citation: >-`、本文は次の行から字下げ（スペース4つ）して貼る。"..." で囲まない。複数行に分かれていても1行につながる。
# category は下記のいずれか
#   論文誌
#   国際会議/査読付収録論文
#   国内研究会/収録論文/口頭発表等
#   講演等
#   報道・展示等
#   学術解説等
#   著書
#   特許出願
#   受賞等
# 上記以外の分類は業績ページに表示されない。year は 2015 以上の年度（2014 以前は表示されない）。
# 書ける値の一覧は src/data/allowed-values.json。範囲外は npm run check:data で警告される。
# 同じ年度・分類の中の表示順は、このファイルに書いた順（上から）。id の番号は順番に影響しない。追加したい位置に書く。

