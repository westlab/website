<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IEEE 2992 のデータ循環</title>
  <desc id="desc">農場のデータを階層タグで表現し、交換、検索、AI、デジタルツイン、意思決定へつなげる概念図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbf2"/><stop offset="1" stop-color="#e9f8f4"/></linearGradient>
    <filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#264c39" flood-opacity=".15"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#309c74"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="82" y="95" fill="#143a2b" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="48" font-weight="700">IEEE 2992-2025：農業データを「使い回せる意味」にする</text>
  <text x="84" y="140" fill="#557467" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22">表現・交換・処理を共通化し、異種システムを AI とデジタルツインへ接続</text>

  <path d="M360 465H505" stroke="#309c74" stroke-width="8" marker-end="url(#a)"/>
  <path d="M790 465H925" stroke="#309c74" stroke-width="8" marker-end="url(#a)"/>
  <path d="M1210 465H1340" stroke="#309c74" stroke-width="8" marker-end="url(#a)"/>
  <path d="M1410 630 C1300 790 320 790 195 625" fill="none" stroke="#71bea0" stroke-width="6" stroke-dasharray="12 14" marker-end="url(#a)"/>

  <g>
    <rect x="70" y="250" width="290" height="380" rx="30" fill="#fff"/>
    <rect x="70" y="250" width="290" height="14" rx="7" fill="#69b82c"/>
    <text x="215" y="325" text-anchor="middle" fill="#173e2e" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">FIELD</text>
    <path d="M135 435h160v105H135z" fill="#e8f7d8" stroke="#69b82c" stroke-width="4"/>
    <path d="M115 435l100-95 100 95" fill="#d6efbd" stroke="#69b82c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M215 540v-84" stroke="#42921f" stroke-width="6"/>
    <path d="M214 470c-28-20-50-15-63 7 27 5 46 4 63-7Zm2 18c28-20 50-15 63 7-27 5-46 4-63-7Z" fill="#48a329"/>
    <text x="215" y="580" text-anchor="middle" fill="#547363" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18">作物・環境・地理・農家</text>
    <text x="215" y="608" text-anchor="middle" fill="#7a9387" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">機械・温室・エネルギー</text>
  </g>

  <g>
    <rect x="505" y="250" width="285" height="380" rx="30" fill="#0e4639"/>
    <rect x="505" y="250" width="285" height="14" rx="7" fill="#54d19d"/>
    <text x="647.5" y="325" text-anchor="middle" fill="#effff9" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">SEMANTICS</text>
    <rect x="548" y="375" width="199" height="135" rx="20" fill="#174f42" stroke="#78e2b6" stroke-width="3"/>
    <text x="647.5" y="418" text-anchor="middle" fill="#eafff6" font-family="Arial, sans-serif" font-size="20" font-weight="700">_2992 / Sector</text>
    <text x="647.5" y="451" text-anchor="middle" fill="#b9ead6" font-family="Arial, sans-serif" font-size="18">/ Location</text>
    <text x="647.5" y="484" text-anchor="middle" fill="#b9ead6" font-family="Arial, sans-serif" font-size="18">/ Endpoint</text>
    <text x="647.5" y="557" text-anchor="middle" fill="#c3e7d9" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">階層タグと命名規則</text>
    <text x="647.5" y="587" text-anchor="middle" fill="#91c8b1" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">意味を形式から分離</text>
  </g>

  <g>
    <rect x="925" y="250" width="285" height="380" rx="30" fill="#fff"/>
    <rect x="925" y="250" width="285" height="14" rx="7" fill="#1fae93"/>
    <text x="1067.5" y="325" text-anchor="middle" fill="#173e2e" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">INTEROPERATE</text>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <rect x="970" y="374" width="90" height="52" rx="15" fill="#e5f8ef"/><text x="1015" y="407" fill="#1d7256">JSON</text>
      <rect x="1075" y="374" width="90" height="52" rx="15" fill="#e5f8ef"/><text x="1120" y="407" fill="#1d7256">XML</text>
      <rect x="970" y="444" width="90" height="52" rx="15" fill="#e5f8ef"/><text x="1015" y="477" fill="#1d7256">YAML</text>
      <rect x="1075" y="444" width="90" height="52" rx="15" fill="#e5f8ef"/><text x="1120" y="477" fill="#1d7256">CSV</text>
    </g>
    <text x="1067.5" y="545" text-anchor="middle" fill="#547363" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18">REST / MQTT / WebSocket</text>
    <text x="1067.5" y="580" text-anchor="middle" fill="#7a9387" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">検索・変換・カプセル化</text>
  </g>

  <g>
    <rect x="1340" y="250" width="190" height="380" rx="30" fill="#123f5a"/>
    <rect x="1340" y="250" width="190" height="14" rx="7" fill="#57c4e5"/>
    <text x="1435" y="325" text-anchor="middle" fill="#effbff" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" font-weight="700">VALUE</text>
    <circle cx="1435" cy="420" r="58" fill="#1c5877" stroke="#73d5ee" stroke-width="4"/>
    <path d="M1405 428c23-52 73-44 65-3-6 33-52 47-65 3Z" fill="#74d7ef" opacity=".88"/>
    <text x="1435" y="530" text-anchor="middle" fill="#d6f2fa" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18">AI / Digital Twin</text>
    <text x="1435" y="566" text-anchor="middle" fill="#aad5e2" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">予測・制御・経営</text>
  </g>

  <rect x="475" y="706" width="650" height="92" rx="46" fill="#fff" stroke="#9ed8c2" stroke-width="2"/>
  <text x="800" y="744" text-anchor="middle" fill="#184837" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22" font-weight="700">計測事例を参照し、実装可能性を検討</text>
  <text x="800" y="775" text-anchor="middle" fill="#58776a" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">NARO 関連の圃場・温室データを、表現と処理の検討材料に</text>
</svg>
