<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">IEEE 1451.1.6 と MQTT の構成</title>
  <desc id="desc">センサーとアクチュエータ、NCAP、MQTTブローカー、アプリケーションの情報の流れを示す独自模式図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f9ff"/><stop offset="1" stop-color="#e8f5f7"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f3b57" flood-opacity=".16"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#1689ae"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="95" fill="#0b2944" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="48" font-weight="700">IEEE 1451.1.6-2025：MQTT でつなぐスマートトランスデューサ</text>
  <text x="83" y="139" fill="#547087" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="22">軽量な publish / subscribe 通信に、IEEE 1451 の意味とサービスを載せる</text>

  <path d="M355 430H535" stroke="#1689ae" stroke-width="8" marker-end="url(#a)"/>
  <path d="M845 430H1015" stroke="#1689ae" stroke-width="8" marker-end="url(#a)"/>
  <path d="M1285 430H1460" stroke="#1689ae" stroke-width="8" marker-end="url(#a)"/>
  <path d="M1450 480H1295" stroke="#70b7c8" stroke-width="5" marker-end="url(#a)"/>
  <path d="M1005 480H855" stroke="#70b7c8" stroke-width="5" marker-end="url(#a)"/>
  <path d="M525 480H365" stroke="#70b7c8" stroke-width="5" marker-end="url(#a)"/>

  <g>
    <rect x="75" y="260" width="280" height="350" rx="30" fill="#fff"/>
    <rect x="75" y="260" width="280" height="14" rx="7" fill="#22c55e"/>
    <text x="215" y="330" text-anchor="middle" fill="#15344c" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">現場デバイス</text>
    <circle cx="150" cy="410" r="52" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
    <path d="M128 421c12-33 32-45 54-49-1 31-16 53-54 49Z" fill="#22a45a"/>
    <circle cx="277" cy="410" r="52" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4"/>
    <path d="M247 412h60M277 382v60" stroke="#0a83bd" stroke-width="9" stroke-linecap="round"/>
    <text x="215" y="505" text-anchor="middle" fill="#3c6077" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20">Sensors / Actuators</text>
    <text x="215" y="543" text-anchor="middle" fill="#6b8394" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">計測・状態・制御</text>
  </g>

  <g>
    <rect x="535" y="260" width="310" height="350" rx="30" fill="#fff"/>
    <rect x="535" y="260" width="310" height="14" rx="7" fill="#2563eb"/>
    <text x="690" y="330" text-anchor="middle" fill="#15344c" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">NCAP</text>
    <rect x="600" y="375" width="180" height="84" rx="16" fill="#e9f1ff" stroke="#5b8def" stroke-width="3"/>
    <text x="690" y="410" text-anchor="middle" fill="#17458a" font-family="Arial, sans-serif" font-size="22" font-weight="700">IEEE 1451</text>
    <text x="690" y="439" text-anchor="middle" fill="#416384" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">services + messages</text>
    <text x="690" y="510" text-anchor="middle" fill="#3c6077" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18">TEDS / command / response</text>
    <text x="690" y="546" text-anchor="middle" fill="#6b8394" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17">デバイスを意味のある情報へ</text>
  </g>

  <g>
    <rect x="1015" y="260" width="270" height="350" rx="30" fill="#0b2944"/>
    <rect x="1015" y="260" width="270" height="14" rx="7" fill="#06b6d4"/>
    <text x="1150" y="330" text-anchor="middle" fill="#eefaff" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700">MQTT Broker</text>
    <circle cx="1150" cy="418" r="68" fill="#103e5d" stroke="#60d7e8" stroke-width="4"/>
    <circle cx="1150" cy="418" r="15" fill="#7ce6f2"/>
    <path d="M1150 378a40 40 0 0 1 0 80M1150 354a64 64 0 0 1 0 128M1150 378a40 40 0 0 0 0 80M1150 354a64 64 0 0 0 0 128" fill="none" stroke="#7ce6f2" stroke-width="7" stroke-linecap="round"/>
    <text x="1150" y="535" text-anchor="middle" fill="#b8d8e8" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18">publish / subscribe</text>
    <text x="1150" y="565" text-anchor="middle" fill="#8bb0c3" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="16">軽量な publish / subscribe 通信</text>
  </g>

  <g>
    <rect x="1460" y="260" width="90" height="350" rx="28" fill="#fff"/>
    <rect x="1477" y="325" width="56" height="45" rx="10" fill="#dbeafe"/>
    <rect x="1477" y="400" width="56" height="45" rx="10" fill="#cffafe"/>
    <rect x="1477" y="475" width="56" height="45" rx="10" fill="#dcfce7"/>
    <text x="1505" y="565" text-anchor="middle" fill="#365870" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="15">Cloud</text>
  </g>

  <rect x="300" y="700" width="1000" height="112" rx="26" fill="#fff" stroke="#c6d9e6" stroke-width="2"/>
  <text x="800" y="742" text-anchor="middle" fill="#15344c" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="23" font-weight="700">標準が追加する共通機能</text>
  <text x="800" y="782" text-anchor="middle" fill="#4b6b80" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20">3 種類のメッセージ搬送形式　／　時刻同期　／　セキュリティ　／　拡張機能</text>
</svg>
